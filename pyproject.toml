[project]
name = "nevia-agent"
version = "0.1.0"
description = "Agents on Nevia: m2p moves a MongoDB to PostgreSQL with mongo2pg, acc changes an app and opens a pull request"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "nevia-kit",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
agent = "core.local.cli:main"

[dependency-groups]
dev = [
    "openapi-core>=0.23.1",
    "prek>=0.5.7",
    "pymongo>=4.19.0",  # for tests/m2p/usecase: seed.py runs on the source computer, with Debian's
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.92",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["core", "m2p", "acc"]

[tool.uv.sources]
nevia-kit = { git = "ssh://git@github.com/aiven/nevia-kit", tag = "v0.1.0" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PTH", "RUF", "PL", "S", "T20"]
ignore = [
    "PLR2004", # thresholds such as exit codes read better inline
    "S603",    # every subprocess call runs a fixed argv, never a shell string
    "S607",    # curl is found on PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"src/m2p/usecase/seed.py" = ["PLR0912", "PLR0915", "C901", "E501", "T201", "PLW0108"]  # PLW0108: every maybe() takes a lambda, as in seed.mjs
"tests/*" = ["S101"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
