# Settings for both agents: what you may choose, the rest is in the code. Each agent works in its own Nevia
# workspace (`<agent>.nevia.workspace`, made by `setup` if need be), and everything it makes there carries its
# name: resources m2p-... or acc-... (checked when this file is read), workspace secrets M2P_... or ACC_....
# No secret here: `.env` has the values `setup` reads.

[runtime]
# The agents' own code runs on their computers: your machine only makes the agent computer, its key and the
# secrets, then sends this code there, where uv installs this Python and the dependencies, next to the nevia
# CLI signed in with the agent's key: both agents drive Nevia with it, as you do with yours.
uv = "0.13.6"
python = "3.15"
nevia = "0.1.13"

[ai]
# The AI agent both agents run: "claude" (Claude Code) or "copilot" (GitHub Copilot CLI), through the Aiven
# AI gateway. Its key is the env var gateway_secret names (in .env), into the workspace secret <AGENT>_<it>.
engine = "claude"
gateway_secret = "AIVEN_AI_API_KEY"

[ai.claude]
version = "stable"                   # its native installer's: stable, latest or a version
# Claude Code's ANTHROPIC_BASE_URL: the gateway must serve Anthropic's Messages API there (/v1/messages).
# Empty: log Claude Code in once on the agent computer instead (nevia shell, then claude and /login).
gateway_url = "https://ai.aiven.io"
model = "claude-sonnet-5-5"          # Claude Sonnet, as the gateway names it; empty: Claude Code's default
reasoning_effort = "medium"          # low to max: lower is faster per turn, but may need more turns
max_turns = 150                      # per session

[ai.copilot]
version = "1.0.105"
# npm's integrity for @github/copilot-linux-x64, checked before installing.
integrity = "sha512-3trlyisQQAnlNy3CvYVRDVWC/WK+0CfDId7dDwNbxTFJ9IgM3aoCPyg+QbGPBUeuYNs4sjgtTqFn5l5yfyHVDg=="
gateway_url = "https://ai.aiven.io/v1"   # OpenAI-compatible
model = "gpt-6.1-sol"
reasoning_effort = "medium"          # none to max: lower is faster per turn, but may need more tries
wire_api = "responses"
max_prompt_tokens = 400000
max_output_tokens = 64000

[mongodb]
# The MongoDB both agents run, in a Podman pod on their MongoDB computer (core/scripts/mongo-up.sh).
image = "docker.io/library/mongo:8.0.34"
cache_gb = 0.25          # WiredTiger's cache: uncapped, mongod outgrows a 2 GiB computer

[mongo2pg]
# The release both agents run: m2p loads with it, acc analyses the app's data with it.
repo = "https://github.com/pmpetit/mongo2pg.git"
release = "mongo2pg-v0.8.0"   # its linux-x86_64 binary, checked against GitHub's sha256
sample_percent = 1            # of each collection, that m2p's infer reads to work out the model (not init's 1000 documents)

# ======================================================================================================
# m2p: an agent loop works out how to load the hello MongoDB into PostgreSQL with mongo2pg.
# ======================================================================================================

[m2p.nevia]
workspace = "m2p"        # its own: its agent's key, an editor's, reaches nothing else

[m2p.mongo]
# The source: a computer running MongoDB with the use case's data.
computer = "m2p-mongo"
database = "hello"       # also the Postgres database and schema mongo2pg loads into

[m2p.seed]
# What seed.py generates on the source computer when its MongoDB is empty; the same values give the
# same documents. `python src/m2p/usecase/seed.py --help` describes them.
customers = 5000
seed = 42
strange = 0.5              # percent of customers with anomalies of `strange_kinds` (too few strange customers may miss a kind: seed.py warns)
strange_kinds = ["date-string", "price-string"]   # [] for none, ["all"], or some of seed.py's kinds

[m2p.postgres]
name = "m2p-pg"          # the target; its URI in the workspace secret M2P_PG_URL

[m2p.agent]
computer = "m2p-agent"
dir = "loop"             # its working directory, under the computer user's home
hours = 1                # how long a run may take
sessions = 3             # AI sessions in a run, if one stops before DONE.md

# ======================================================================================================
# acc: an AI agent changes an app (its migration to Postgres, or a feature) and opens a pull request.
# ======================================================================================================

[acc.nevia]
workspace = "acc"        # its own: its agent's key (an editor's) and its AI's (a viewer's) reach nothing else

[acc.repo]
# The app the agent changes: a Maven project whose application.properties has database.kind = mongo or
# postgres. It never pushes to base_branch and never merges. Its token is GITHUB_TOKEN, in .env.
github = "bertrandcedric/helloworld"
base_branch = "main"

[acc.app]
# The app's own computer, rebuilt from base_branch at each run; a run's sandbox is <computer>-<run>.
computer = "acc-app"
port = 8080
jdk = 21
maven = "3.9.16"

[acc.mongo]
# The app's MongoDB, with its seed data (local/mongo-init/*.js); a run's fork is <computer>-<run>.
computer = "acc-mongo"
database = "hello"

[acc.chisel]
# How the app reaches MongoDB: Nevia publishes HTTPS only, and the link outlives any run.
version = "1.10.1"

[acc.postgres]
name = "acc-pg"          # the app's Postgres once it runs on one; a sandbox's is <name>-<run>
# The app's DATABASE_URL (the stack's and the sandbox's) through the database's pooler (port 6432, transaction
# pooling), with prepareThreshold=0 for JDBC (the seed data's psql goes through it without); the AI's own
# Postgres doesn't.
pooler = false

[acc.agent]
computer = "acc-agent"
dir = "acc"              # its working directory, under the computer user's home
hours = 2                # how long the AI may take
# What Claude Code may use without asking; Copilot CLI may use all (the AI runs as its own Unix user anyway).
allowed_tools = [
    "Read", "Edit", "Write", "Glob", "Grep", "KillShell",
    "Bash(mvn:*)", "Bash(java:*)", "Bash(jar:*)", "Bash(curl:*)", "Bash(psql:*)", "Bash(pg_dump:*)",
    "Bash(diff:*)", "Bash(sleep:*)", "Bash(echo:*)", "Bash(unzip:*)", "Bash(kill:*)", "Bash(pkill:*)",
    "Bash(grep:*)", "Bash(tail:*)", "Bash(head:*)", "Bash(wc:*)", "Bash(sort:*)",   # in pipes too
    "Bash(sh:*)", "Bash(python3:*)", "Bash(ls:*)", "Bash(cat:*)", "Bash(find:*)",   # it runs mvn anyway, as its own user
    "Bash(nevia:*)",   # the Nevia CLI, signed in with a viewer's key of its own: it only looks
]
